<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>購入判断サポーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="app">
    <h1>🛒 購入判断サポーター</h1>

    <div class="input-group">
      <label>商品名<input id="itemName" type="text" placeholder="例：最新ガジェット"></label>
      <label>値段（円）<input type="text" id="price" inputmode="numeric" placeholder="例：150000"></label>
      
      <div class="range-group">
        <label>使用頻度（月）<span class="value"><span id="frequencyValue">10</span> 回</span>
          <input type="range" id="frequency" min="0" max="30" value="10">
        </label>
      </div>

      <div class="range-group">
        <label>欲しさ<span class="value"><span id="desireValue">50</span></span>
          <input type="range" id="desire" min="0" max="100" value="50">
        </label>
      </div>

      <label>カテゴリ
        <select id="category">
          <option value="1.1">🎓 学習・仕事</option>
          <option value="1.0">💻 ガジェット</option>
          <option value="0.9">👕 ファッション</option>
        </select>
      </label>

      <label>過去の後悔
        <select id="regret">
          <option value="1.0">してない</option>
          <option value="0.7">よくする</option>
        </select>
      </label>
    </div>

    <button class="judge-btn" id="judgeBtn" onclick="judgeWithAI()">🤖 AIに相談する</button>
    <div id="loading" style="display:none; text-align:center; margin:15px 0;">分析中...</div>
    <div id="result" class="result" style="display:none;"></div>

    <hr>
    <h2>📜 判断履歴 (<span id="historyMonthDisplay">選択月</span>)</h2>
    <div id="history"></div>
  </div>

  <div class="sidebar">
    <section class="sidebar-box">
      <h2>💰 お財布状況</h2>
      
      <label style="font-size: 12px; color: #666;">表示月の切り替え:</label>
      <select id="monthSelector" onchange="renderHistory()" style="margin-bottom: 20px;"></select>

      <div class="budget-display-area">
        <div class="stat-label">設定予算</div>
        <div id="displayBudget" class="budget-value">0円</div>
        <div class="budget-input-group" style="display: flex; gap: 5px;">
          <input type="text" id="budgetInput" inputmode="numeric" placeholder="金額">
          <button onclick="updateBudget()" style="padding: 5px 10px; cursor: pointer;">登録</button>
        </div>
      </div>

      <div class="stat-label" style="margin-top: 20px;">今月の出費合計</div>
      <div id="totalAmount" class="total-amount" style="color: #e74c3c;">0円</div>
      
      <div class="saving-box" style="margin-top: 20px; border-top: 1px solid #eee; pt: 10px;">
        <div class="stat-label">🎊 累計節約額</div>
        <div id="totalSavings" class="saving-amount">0円</div>
      </div>
    </section>

    <section class="sidebar-box data-mgmt">
      <h2>⚙️ データ管理</h2>
      <button onclick="exportData()" style="width: 100%; margin-bottom: 10px;">バックアップ保存</button>
      <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
      <button onclick="document.getElementById('importFile').click()" style="width: 100%;">読込</button>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
